# fly.toml app configuration file generated for email-os-backend on 2026-09-06T09:08:57+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'email-os-backend'
primary_region = 'iad'

[build]
  dockerfile = 'packages/backend/Dockerfile'

[deploy]
  release_command = 'bun run src/index.ts migrate'

[env]
  NODE_ENV = 'production'
  OPENROUTER_BASE_URL = 'https://openrouter.ai/api/v1'
  OPENROUTER_MODEL = 'openai/gpt-5.6-luna'
  PORT = '8787'
  SESSION_TTL_DAYS = '30'

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '15s'
    timeout = '3s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpus = 1
  memory_mb = 512
